<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#245b4a">
<link rel="apple-touch-icon" href="apple-touch-icon.PNG">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Minha Lista de Compras</title>
<style>
:root{--green:#245b4a;--green2:#347861;--bg:#f3f6f4;--card:#fff;--text:#17231d;--muted:#6d7972;--line:#e0e8e3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:linear-gradient(135deg,#245b4a,#347861);color:#fff;padding:26px 18px 22px;border-radius:0 0 24px 24px}
h1{font-size:27px;line-height:1.1;margin:8px 0}
main{max-width:700px;margin:0 auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(1,minmax(0,1fr));gap:10px;margin-top:-2px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat small{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}
.stat strong{font-size:21px;letter-spacing:-.5px}
.progress-wrap{height:7px;background:#e6eee9;border-radius:10px;overflow:hidden;margin-top:10px}
.progress{height:100%;background:var(--green2);width:0;transition:width .2s}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:23px 2px 10px}
h2{font-size:18px;margin:0}
.category{margin:13px 0 10px}
.category-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#e6eee9;color:var(--green);border:0;border-radius:13px;padding:13px 14px;font-weight:750;text-align:left}
.category-head .left{display:flex;align-items:center;gap:8px;min-width:0}
.category-head .category-name{overflow-wrap:anywhere}
.category-meta{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.category-chevron{font-size:18px;transition:transform .18s}
.category.collapsed .category-chevron{transform:rotate(-90deg)}
.category-content{padding-top:9px}
.category.collapsed .category-content{display:none}
.small-muted{color:var(--muted);font-size:12px}
button{font:inherit;cursor:pointer}
.primary{background:var(--green);color:#fff;border:0;border-radius:12px;padding:11px 14px;font-weight:650}
.secondary{background:#e6eee9;color:var(--green);border:0;border-radius:10px;padding:9px 11px;font-weight:650}
.item{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:9px;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px}
.item.done{opacity:.72}
.item.done .name-input{text-decoration:line-through;color:var(--muted)}
.check{width:23px;height:23px;accent-color:var(--green);margin-top:3px}
.fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px;margin-top:9px}
label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
input,textarea,select{width:100%;font:inherit;color:var(--text);background:#fbfcfb;border:1px solid var(--line);border-radius:9px;padding:10px;min-width:0}
input{font-size:14px}
.name-input{font-weight:700;font-size:15px}
.item-top{display:flex;gap:8px;align-items:center}
.item-top input{flex:1}
.delete{border:0;background:transparent;color:#a14b42;font-size:19px;padding:4px 7px}
.item-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.item-bottom .price{font-size:13px;font-weight:700;color:var(--green)}
.note-box{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px}
textarea{resize:vertical;min-height:70px}
.budget{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.budget input{max-width:145px;text-align:right;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 8px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px 8px 28px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#17231d;color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;display:none;max-width:90%;z-index:10}
.modal-backdrop{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:20;padding:12px}
.modal-backdrop.show{display:flex}
.modal{width:min(100%,520px);background:#fff;border-radius:20px;padding:18px;box-shadow:0 12px 40px #0003;max-height:85vh;overflow:auto}
.modal h3{margin:0 0 14px;font-size:19px}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions button{flex:1}
@media(min-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.item{padding:15px}.fields{grid-template-columns:1fr 1fr 1fr}.modal-backdrop{align-items:center}}
</style>
</head>
<body>
<header><h1>Minha Lista de Compras</h1></header>
<main>
<section class="stats">
 <div class="stat"><small>Total previsto</small><strong id="total">R$ 0,00</strong><div class="progress-wrap"><div class="progress" id="progress"></div></div></div>
 <div class="stat"><small>Orçamento disponível</small><strong id="balance">R$ 0,00</strong></div>
</section>
<div class="section-head">
 <div><h2>Lista de compras</h2><div class="small-muted">Edite nome, quantidade e valor por unidade</div></div>
 <button class="primary" id="add">+ Adicionar</button>
</div>
<div id="items"></div>
<div class="section-head"><h2>Orçamento</h2></div>
<section class="note-box">
 <div class="budget"><div><strong>Limite disponível</strong></div><input id="budget" type="number" min="0" step="0.01" value="450" aria-label="Orçamento total"></div>
 <div class="budget"><span>Total dos itens ativos</span><strong id="spent">R$ 0,00</strong></div>
</section>
<div class="section-head"><h2>Observações</h2></div>
<section class="note-box">
 <label for="notes">Anote informações importantes sobre a compra</label>
 <textarea id="notes" placeholder="Ex.: mercado vai doar o arroz..."></textarea>
</section>
<div class="actions">
 <button class="primary" id="saveList">Salvar lista para reutilizar</button>
 <button class="secondary" id="loadList">Usar lista salva</button>
 <button class="secondary" id="export">Exportar lista</button>
 <button class="secondary" id="reset">Restaurar lista inicial</button>
</div>
<footer>Seus dados ficam salvos neste navegador neste aparelho.</footer>
</main>
<div class="toast" id="toast"></div>

<div class="modal-backdrop" id="addModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
 <div class="modal">
  <h3 id="modalTitle">Adicionar produto</h3>
  <label for="newName">Nome do produto</label>
  <input id="newName" type="text" placeholder="Ex.: Óleo de soja">
  <div style="height:12px"></div>
  <label for="newCategory">Escolher grupo</label>
  <select id="newCategory"></select>
  <div style="height:12px"></div>
  <label for="newCategoryName">Ou criar um novo grupo (opcional)</label>
  <input id="newCategoryName" type="text" placeholder="Nome do novo grupo">
  <div class="modal-actions">
   <button class="secondary" id="cancelAdd">Cancelar</button>
   <button class="primary" id="confirmAdd">Adicionar</button>
  </div>
 </div>
</div>

const key="acaoSocialCasaV3";
const savedListsKey="acaoSocialSavedListsCasaV3";
const viewKey="acaoSocialCasaViewV1";
let state;
try{state=JSON.parse(localStorage.getItem(key))||null}catch(e){state=null}
if(!state)state={items:JSON.parse(JSON.stringify(initialItems)),budget:450,notes:""};
state.items=(state.items||[]).map(it=>({...it,category:it.category||"Geral",qty:Number(it.qty)||0,price:Number(it.price)||0,bought:!!it.bought}));
let viewState={collapsed:{},lastCategory:"",scrollY:0};
try{viewState={...viewState,...(JSON.parse(localStorage.getItem(viewKey))||{})};viewState.collapsed=viewState.collapsed||{}}catch(e){}
const fmt=n=>(Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
function parseLocaleNumber(value){
 const s=String(value).trim().replace(/\s/g,"");
 if(!s)return 0;
 const normalized=s.includes(",")?s.replace(/\./g,"").replace(",","."):s;
 const n=Number(normalized);
 return Number.isFinite(n)?n:0;
}
function formatInputNumber(value){
 return String(Number(value)||0).replace(".",",");
}
function saveView(){try{localStorage.setItem(viewKey,JSON.stringify(viewState))}catch(e){}}
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}renderStats()}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.style.display="block";clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display="none",2200)}
function categories(){return [...new Set(state.items.map(it=>it.category||"Geral"))]}
function renderCategoryOptions(){
 const sel=document.getElementById("newCategory");sel.innerHTML="";
 categories().forEach(cat=>{const op=document.createElement("option");op.value=cat;op.textContent=cat;sel.appendChild(op)});
 if(!sel.options.length){const op=document.createElement("option");op.value="Geral";op.textContent="Geral";sel.appendChild(op)}
}
function render(){
 const root=document.getElementById("items");root.innerHTML="";
 const groups=new Map();
 state.items.forEach((it,i)=>{const cat=it.category||"Geral";if(!groups.has(cat))groups.set(cat,[]);groups.get(cat).push({it,i})});
 for(const [category,entries] of groups){
  const section=document.createElement("section");section.className="category"+(viewState.collapsed[category]?" collapsed":"");section.dataset.category=category;
  const activeCount=entries.filter(x=>!x.it.bought).length;
  const head=document.createElement("button");head.type="button";head.className="category-head";
  head.innerHTML=`<span class="left"><span class="category-name"></span><span class="category-meta"></span></span><span class="category-chevron">⌄</span>`;
  head.querySelector(".category-name").textContent=category;
  head.querySelector(".category-meta").textContent=`${activeCount}/${entries.length} ativos`;
  const content=document.createElement("div");content.className="category-content";
  head.addEventListener("click",()=>{
   viewState.collapsed[category]=!viewState.collapsed[category];
   viewState.lastCategory=category;saveView();section.classList.toggle("collapsed",!!viewState.collapsed[category]);
  });
  entries.forEach(({it,i})=>{
   const el=document.createElement("article");el.className="item"+(it.bought?" done":"");
   el.innerHTML=`<input class="check" type="checkbox" aria-label="Marcar como não comprar" ${it.bought?"checked":""}>
    <div><div class="item-top"><input class="name-input" aria-label="Produto"><button class="delete" aria-label="Excluir item" title="Excluir item">×</button></div>
    <div class="fields"><div><label>Quantidade</label><input class="qty" type="text" inputmode="decimal" placeholder="0" aria-label="Quantidade"></div>
    <div><label>Valor (R$)</label><input class="price-input" type="text" inputmode="decimal" placeholder="0,00" aria-label="Valor por unidade"></div></div>
    <div class="item-bottom"><span class="small-muted item-status"></span><span class="price"></span></div></div>`;
   const check=el.querySelector(".check"),name=el.querySelector(".name-input"),del=el.querySelector(".delete"),qty=el.querySelector(".qty"),price=el.querySelector(".price-input");
   name.value=it.name||"";qty.value=formatInputNumber(it.qty);price.value=formatInputNumber(it.price);
   check.addEventListener("change",()=>{it.bought=check.checked;el.classList.toggle("done",it.bought);el.querySelector(".item-status").textContent=it.bought?"Não comprar":"Ativo";save();renderStats();updateGroupMeta(section,entries)});
   name.addEventListener("input",()=>{it.name=name.value;save()});
   qty.addEventListener("input",()=>{it.qty=parseLocaleNumber(qty.value);el.querySelector(".price").textContent=fmt(it.qty*it.price);save()});
   price.addEventListener("input",()=>{it.price=parseLocaleNumber(price.value);el.querySelector(".price").textContent=fmt(it.qty*it.price);save()});
   del.addEventListener("click",()=>{if(confirm("Excluir "+(it.name||"este item")+" da lista?")){state.items.splice(state.items.indexOf(it),1);save();render()}});
   el.querySelector(".item-status").textContent=it.bought?"Não comprar":"Ativo";
   el.querySelector(".price").textContent=fmt(it.qty*it.price);
   content.appendChild(el);
  });
  section.append(head,content);root.appendChild(section);
 }
 document.getElementById("budget").value=state.budget;
 document.getElementById("notes").value=state.notes||"";
 renderStats();
}
function updateGroupMeta(section,entries){const active=entries.filter(x=>!x.it.bought).length;section.querySelector(".category-meta").textContent=`${active}/${entries.length} ativos`}
function renderStats(){
 const active=state.items.filter(x=>!x.bought);
 const total=active.reduce((s,x)=>s+(Number(x.qty)||0)*(Number(x.price)||0),0);
 document.getElementById("total").textContent=fmt(total);
 document.getElementById("spent").textContent=fmt(total);
 document.getElementById("balance").textContent=fmt((Number(state.budget)||0)-total);
 document.getElementById("progress").style.width=(state.items.length?active.length/state.items.length*100:0)+"%";
}
function openAddModal(){
 renderCategoryOptions();document.getElementById("newName").value="";document.getElementById("newCategoryName").value="";
 const remembered=viewState.lastCategory;
 if(remembered&&[...document.getElementById("newCategory").options].some(o=>o.value===remembered))document.getElementById("newCategory").value=remembered;
 document.getElementById("addModal").classList.add("show");setTimeout(()=>document.getElementById("newName").focus(),80);
}
function closeAddModal(){document.getElementById("addModal").classList.remove("show")}
document.getElementById("add").addEventListener("click",openAddModal);
document.getElementById("cancelAdd").addEventListener("click",closeAddModal);
document.getElementById("addModal").addEventListener("click",e=>{if(e.target.id==="addModal")closeAddModal()});
document.getElementById("confirmAdd").addEventListener("click",()=>{
 const name=document.getElementById("newName").value.trim();
 const newCat=document.getElementById("newCategoryName").value.trim();
 const category=newCat||document.getElementById("newCategory").value||"Geral";
 if(!name){toast("Digite o nome do produto");document.getElementById("newName").focus();return}
 state.items.push({category,name,qty:1,price:0,bought:false,note:""});
 viewState.collapsed[category]=false;viewState.lastCategory=category;saveView();save();render();closeAddModal();toast("Produto adicionado em "+category);
 const target=[...document.querySelectorAll(".category")].find(x=>x.dataset.category===category);
 if(target){target.scrollIntoView({behavior:"smooth",block:"start"});viewState.scrollY=window.scrollY;saveView()}
});
document.getElementById("budget").addEventListener("input",e=>{state.budget=Number(e.target.value)||0;save()});
document.getElementById("notes").addEventListener("input",e=>{state.notes=e.target.value;save()});
function getSavedLists(){try{return JSON.parse(localStorage.getItem(savedListsKey))||[]}catch(e){return []}}
document.getElementById("saveList").addEventListener("click",()=>{
 const name=prompt("Dê um nome para esta lista:","Lista de compras");if(name===null)return;
 const clean=name.trim();if(!clean){toast("Digite um nome para salvar a lista");return}
 const lists=getSavedLists(),existing=lists.findIndex(x=>x.name.toLowerCase()===clean.toLowerCase());
 const snapshot={name:clean,savedAt:new Date().toISOString(),items:JSON.parse(JSON.stringify(state.items)),budget:Number(state.budget)||0,notes:state.notes||""};
 if(existing>=0){if(!confirm("Já existe uma lista com esse nome. Deseja substituir?"))return;lists[existing]=snapshot}else lists.push(snapshot);
 try{localStorage.setItem(savedListsKey,JSON.stringify(lists));toast("Lista salva!")}catch(e){toast("Erro ao salvar no navegador.")}
});
document.getElementById("loadList").addEventListener("click",()=>{
 const lists=getSavedLists();if(!lists.length){toast("Você não tem listas salvas");return}
 const answer=prompt("Digite o número da lista:\n\n"+lists.map((x,i)=>`${i+1}. ${x.name}`).join("\n"));if(answer===null)return;
 const index=Number(answer)-1;if(!Number.isInteger(index)||index<0||index>=lists.length){toast("Número inválido");return}
 if(!confirm("Carregar esta lista substituirá a atual. Continuar?"))return;
 const chosen=lists[index];state={items:JSON.parse(JSON.stringify(chosen.items||[])),budget:Number(chosen.budget)||0,notes:chosen.notes||""};
 viewState={collapsed:{},lastCategory:"",scrollY:0};saveView();save();render();toast("Lista carregada!");
});
document.getElementById("reset").addEventListener("click",()=>{
 if(confirm("Restaurar lista original? Suas alterações atuais serão substituídas.")){state={items:JSON.parse(JSON.stringify(initialItems)),budget:450,notes:""};viewState={collapsed:{},lastCategory:"",scrollY:0};saveView();save();render();toast("Lista restaurada")}
});
document.getElementById("export").addEventListener("click",()=>{
 const lines=["MINHA LISTA DE COMPRAS",""],itemTotal=x=>(Number(x.qty)||0)*(Number(x.price)||0);
 const groups=new Map();
 state.items.forEach(it=>{
  const category=it.category||"Geral";
  if(!groups.has(category))groups.set(category,[]);
  groups.get(category).push(it);
 });
 for(const [category,items] of groups){
  lines.push(category);
  items.forEach(it=>{
   const status=it.bought?"[não comprar] ":"";
   lines.push(`- ${status}${it.name} | Qtd: ${formatInputNumber(it.qty)} | Unit.: ${fmt(it.price)} | Total: ${fmt(itemTotal(it))}`);
  });
  lines.push("");
 }
 const total=state.items.filter(x=>!x.bought).reduce((sum,x)=>sum+itemTotal(x),0);
 lines.push(`TOTAL PREVISTO: ${fmt(total)}`,`ORÇAMENTO: ${fmt(state.budget)}`,"","OBSERVAÇÕES:",state.notes||"Nenhuma");
 const blob=new Blob([lines.join("\n")],{type:"text/plain;charset=utf-8"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="minha-lista-de-compras.txt";a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
 toast("Lista exportada!");
});
// Salva automaticamente a posição e restaura ao reabrir/recarregar a página.
let scrollSaveTimer;
window.addEventListener("scroll",()=>{viewState.scrollY=window.scrollY;const visible=document.elementFromPoint(30,120)?.closest?.(".category");if(visible)viewState.lastCategory=visible.dataset.category||viewState.lastCategory;clearTimeout(scrollSaveTimer);scrollSaveTimer=setTimeout(saveView,180)});
window.addEventListener("pagehide",()=>{viewState.scrollY=window.scrollY;saveView();save()});
render();
if(viewState.scrollY>0){requestAnimationFrame(()=>window.scrollTo(0,viewState.scrollY))}
</script>
</body>
