<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#245b4a">
<title>Minha Ação Social</title>
<style>
:root{--green:#245b4a;--green2:#347861;--bg:#f3f6f4;--card:#fff;--text:#17231d;--muted:#6d7972;--line:#e0e8e3;--orange:#fff2dc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:linear-gradient(135deg,#245b4a,#347861);color:#fff;padding:26px 18px 22px;border-radius:0 0 24px 24px}
.eyebrow{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;opacity:.8;font-weight:700}
h1{font-size:27px;line-height:1.1;margin:8px 0}
header p{margin:8px 0 0;font-size:14px;opacity:.9}
main{max-width:700px;margin:0 auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:-2px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat small{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}
.stat strong{font-size:21px;letter-spacing:-.5px}
.progress-wrap{height:7px;background:#e6eee9;border-radius:10px;overflow:hidden;margin-top:10px}
.progress{height:100%;background:var(--green2);width:0;transition:width .2s}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:23px 2px 10px}
h2{font-size:18px;margin:0}
.small-muted{color:var(--muted);font-size:12px}
button{font:inherit;cursor:pointer}
.primary{background:var(--green);color:#fff;border:0;border-radius:12px;padding:11px 14px;font-weight:650}
.secondary{background:#e6eee9;color:var(--green);border:0;border-radius:10px;padding:9px 11px;font-weight:650}
.item{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:9px;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px}
.item.done{opacity:.72}
.check{width:23px;height:23px;accent-color:var(--green);margin-top:3px}
.fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px;margin-top:9px}
label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
input,textarea{width:100%;font:inherit;color:var(--text);background:#fbfcfb;border:1px solid var(--line);border-radius:9px;padding:9px;min-width:0}
input{font-size:14px}
.name-input{font-weight:700;font-size:15px}
.item-top{display:flex;gap:8px;align-items:center}
.item-top input{flex:1}
.delete{border:0;background:transparent;color:#a14b42;font-size:19px;padding:4px 7px}
.item-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.item-bottom .price{font-size:13px;font-weight:700;color:var(--green)}
.note-box{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px}
textarea{resize:vertical;min-height:70px}
.budget{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.budget input{max-width:145px;text-align:right;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 8px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px 8px 28px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#17231d;color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;display:none;max-width:90%;z-index:5}
@media(min-width:560px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.item{padding:15px}.fields{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<body>
<header>
  
  <h1>Minha lista de compras</h1>
  
</header>
<main>
  <section class="stats">
    <div class="stat"><small>Total previsto</small><strong id="total">R$ 0,00</strong><div class="progress-wrap"><div class="progress" id="progress"></div></div></div>
    <div class="stat"><small>Itens comprados</small><strong id="count">0 de 8</strong></div>
    <div class="stat"><small>Orçamento disponível</small><strong id="balance">R$ 0,00</strong></div>
  </section>

  <div class="section-head">
    <div><h2>Lista de compras</h2><div class="small-muted">Edite nome, quantidade e preço</div></div>
    <button class="primary" id="add">+ Adicionar</button>
  </div>
  <div id="items"></div>

  <div class="section-head"><h2>Orçamento</h2></div>
  <section class="note-box">
    <div class="budget"><div><strong>Limite disponível</strong></div><input id="budget" type="number" min="0" step="0.01" value="450" aria-label="Orçamento total"></div>
    <div class="budget"><span>Total dos itens comprados</span><strong id="spent">R$ 0,00</strong></div>
  </section>

  <div class="section-head"><h2>Observações</h2></div>
  <section class="note-box">
    <label for="notes">Anote doações, quem vai comprar ou outras informações</label>
    <textarea id="notes" placeholder="Ex.: mercado vai doar o arroz..."></textarea>
  </section>

  <div class="actions">
    <button class="secondary" id="export">Exportar lista</button>
    <button class="secondary" id="reset">Restaurar lista inicial</button>
  </div>
  <footer>Seus dados ficam salvos neste navegador neste aparelho.</footer>
</main>
<div class="toast" id="toast"></div>
<script>
const initialItems=[
 {name:"Peito de frango",qty:"8 kg",price:180,range:"R$ 160–200",bought:false,note:""},
 {name:"Creme de leite",qty:"15 caixas",price:52.5,range:"R$ 45–60",bought:false,note:""},
 {name:"Molho de tomate",qty:"2 kg",price:20,range:"R$ 15–25",bought:false,note:""},
 {name:"Arroz",qty:"4 kg",price:30,range:"R$ 25–35",bought:false,note:""},
 {name:"Batata palha",qty:"1,5 kg",price:40,range:"R$ 30–50",bought:false,note:""},
 {name:"Cebola e alho",qty:"1,5 kg no total",price:20,range:"R$ 15–25",bought:false,note:""},
 {name:"Ketchup e mostarda",qty:"Para a receita",price:30,range:"R$ 25–35",bought:false,note:""},
 {name:"Óleo, sal e temperos",qty:"Para a receita",price:25,range:"R$ 20–30",bought:false,note:""}
];
const key="acaoSocialStrogonoffV1";
let state;
try{state=JSON.parse(localStorage.getItem(key))||null}catch(e){state=null}
if(!state)state={items:initialItems,budget:450,notes:""};
const fmt=n=>(Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){} renderStats()}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.style.display="block";setTimeout(()=>t.style.display="none",2200)}
function render(){
 const root=document.getElementById("items");root.innerHTML="";
 state.items.forEach((it,i)=>{
  const el=document.createElement("article");el.className="item"+(it.bought?" done":"");
  el.innerHTML=`<input class="check" type="checkbox" aria-label="Marcar como comprado" ${it.bought?"checked":""}>
   <div>
    <div class="item-top"><input class="name-input" aria-label="Ingrediente" value=""><button class="delete" aria-label="Excluir item" title="Excluir item">×</button></div>
    <div class="fields">
     <div><label>Quantidade</label><input class="qty" value="" aria-label="Quantidade"></div>
     <div><label>Preço previsto (R$)</label><input class="price-input" type="number" min="0" step=".01" value="" aria-label="Preço previsto"></div>
     <div><label>Faixa de preço (opcional)</label><input class="range" value="" aria-label="Faixa de preço"></div>
    </div>
    <div class="item-bottom"><span class="small-muted item-status"></span><span class="price"></span></div>
   </div>`;
  const [check,name,del,qty,price,range]=[el.querySelector(".check"),el.querySelector(".name-input"),el.querySelector(".delete"),el.querySelector(".qty"),el.querySelector(".price-input"),el.querySelector(".range")];
  name.value=it.name;qty.value=it.qty;price.value=it.price;range.value=it.range||"";
  check.addEventListener("change",()=>{it.bought=check.checked;el.classList.toggle("done",it.bought);save();renderStats();el.querySelector(".item-status").textContent=it.bought?"Comprado":"Pendente"});
  name.addEventListener("input",()=>{it.name=name.value;save()});
  qty.addEventListener("input",()=>{it.qty=qty.value;save()});
  price.addEventListener("input",()=>{it.price=Number(price.value)||0;save();renderStats();el.querySelector(".price").textContent=fmt(it.price)});
  range.addEventListener("input",()=>{it.range=range.value;save()});
  del.addEventListener("click",()=>{if(confirm("Excluir "+(it.name||"este item")+" da lista?")){state.items.splice(i,1);save();render()}});
  el.querySelector(".item-status").textContent=it.bought?"Comprado":"Pendente";
  el.querySelector(".price").textContent=fmt(it.price);
  root.appendChild(el);
 });
 document.getElementById("budget").value=state.budget;
 document.getElementById("notes").value=state.notes||"";
 renderStats();
}
function renderStats(){
 const total=state.items.reduce((s,x)=>s+(Number(x.price)||0),0);
 const bought=state.items.filter(x=>x.bought);
 const spent=bought.reduce((s,x)=>s+(Number(x.price)||0),0);
 document.getElementById("total").textContent=fmt(total);
 document.getElementById("count").textContent=`${bought.length} de ${state.items.length}`;
 document.getElementById("spent").textContent=fmt(spent);
 document.getElementById("balance").textContent=fmt((Number(state.budget)||0)-total);
 document.getElementById("progress").style.width=(state.items.length?bought.length/state.items.length*100:0)+"%";
}
document.getElementById("add").addEventListener("click",()=>{state.items.push({name:"Novo ingrediente",qty:"",price:0,range:"",bought:false,note:""});save();render();toast("Item adicionado")});
document.getElementById("budget").addEventListener("input",e=>{state.budget=Number(e.target.value)||0;save()});
document.getElementById("notes").addEventListener("input",e=>{state.notes=e.target.value;save()});
document.getElementById("reset").addEventListener("click",()=>{if(confirm("Restaurar a lista original? Suas alterações atuais serão substituídas.")){state={items:JSON.parse(JSON.stringify(initialItems)),budget:450,notes:""};save();render();toast("Lista restaurada")}});
document.getElementById("export").addEventListener("click",()=>{
 const lines=["CHECKLIST — AÇÃO SOCIAL (50 pessoas)",""];
 state.items.forEach(it=>lines.push(`${it.bought?"[x]":"[ ]"} ${it.name} | ${it.qty} | ${fmt(it.price)} | ${it.range||""}`));
 lines.push("",`Total previsto: ${fmt(state.items.reduce((s,x)=>s+(Number(x.price)||0),0))}`,`Orçamento: ${fmt(state.budget)}`,`Total comprado: ${fmt(state.items.filter(x=>x.bought).reduce((s,x)=>s+(Number(x.price)||0),0))}`,"","Observações:",state.notes||"—");
 const blob=new Blob([lines.join("\n")],{type:"text/plain;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="checklist-acao-social.txt";a.click();URL.revokeObjectURL(url);toast("Lista exportada");
});
render();
</script>
</body>
</html>
